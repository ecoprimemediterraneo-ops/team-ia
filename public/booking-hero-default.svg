<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Salón de belleza">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5C518"/>
      <stop offset="1" stop-color="#EAA92E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <!-- textura de puntos suave -->
  <g fill="#0c0c0c" opacity="0.06">
    <circle cx="90" cy="70" r="6"/><circle cx="190" cy="130" r="6"/><circle cx="70" cy="220" r="6"/>
    <circle cx="1120" cy="360" r="6"/><circle cx="1040" cy="420" r="6"/><circle cx="1150" cy="120" r="6"/>
  </g>
  <!-- Ojo + pestañas (pestañas) -->
  <g transform="translate(420 210)" stroke="#0c0c0c" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M-150 0 Q0 -110 150 0 Q0 110 -150 0 Z" fill="#FAF8F3"/>
    <circle cx="0" cy="0" r="46" fill="#C8202A" stroke="none"/>
    <circle cx="0" cy="0" r="20" fill="#0c0c0c" stroke="none"/>
    <!-- pestañas superiores -->
    <path d="M-120 -34 l-26 -30"/><path d="M-70 -62 l-16 -38"/><path d="M0 -74 l0 -44"/>
    <path d="M70 -62 l16 -38"/><path d="M120 -34 l26 -30"/>
  </g>
  <!-- Ceja (cejas) -->
  <path d="M270 120 Q420 40 580 108" stroke="#0c0c0c" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Labios (labios) -->
  <g transform="translate(830 250)">
    <path d="M-110 0 Q-55 -46 0 -14 Q55 -46 110 0 Q55 44 0 44 Q-55 44 -110 0 Z" fill="#C8202A" stroke="#0c0c0c" stroke-width="10"/>
    <path d="M-110 0 Q0 12 110 0" stroke="#0c0c0c" stroke-width="8" fill="none"/>
  </g>
  <!-- marca sutil -->
  <text x="600" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="26" letter-spacing="6" fill="#0c0c0c" opacity="0.55">AI-TEAM · BOOKING</text>
</svg>
